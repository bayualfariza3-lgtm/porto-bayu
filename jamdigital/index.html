<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="clock">
      <h2>sekarang pukul</h2>

      <div id="date"></div>

      <div id="time">
        <div><span id="hour">00</span><span>hour</span></div>
        <div><span id="minute">00</span><span>minute</span></div>
        <div><span id="second">00</span><span>second</span></div>
        <div><span id="ampm"></span></div>
      </div>
    </div>
  </body>
</html>

<script type="text/javascript">
  function clock() {
    var hours = document.getElementById("hour");
    var minutes = document.getElementById("minute");
    var seconds = document.getElementById("second");
    var ampm = document.getElementById("ampm");
    var dateBox = document.getElementById("date");

    var now = new Date();
    var h = now.getHours();
    var m = now.getMinutes();
    var s = now.getSeconds();
    var am = "AM";

    // Format AM PM
    if (h >= 12) {
      h = h - 12;
      am = "PM";
    }

    h = h < 10 ? "0" + h : h;
    m = m < 10 ? "0" + m : m;
    s = s < 10 ? "0" + s : s;

    // Tanggal
    var options = {
      weekday: "long",
      year: "numeric",
      month: "long",
      day: "numeric",
    };
    var tanggal = now.toLocaleDateString("id-ID", options);

    hours.innerHTML = h;
    minutes.innerHTML = m;
    seconds.innerHTML = s;
    ampm.innerHTML = am;

    dateBox.innerHTML = tanggal;
  }

  setInterval(clock, 1000);
</script>
